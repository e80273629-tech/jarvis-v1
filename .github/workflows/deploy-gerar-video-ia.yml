name: Publicar Edge Function gerar-video-ia

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gerar-video-ia
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/osvyra-v1-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar a branch autorizada
        uses: actions/checkout@v4
        with:
          ref: osvyra-v1-rebuild

      - name: Fixar e conferir o commit autorizado
        run: |
          git checkout --detach 41aba9d069b0ab7d35e2b719255a3c4c50b46e4
          echo "Commit selecionado: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "41aba9d069b0ab7d35e2b719255a3c4c50b46e4"
          test -f supabase/functions/gerar-video-ia/index.ts

      - name: Publicar somente gerar-video-ia
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::O segredo SUPABASE_ACCESS_TOKEN ainda não foi configurado no GitHub."
            exit 1
          fi
          npx --yes supabase@latest functions deploy gerar-video-ia --project-ref zvtsudyxldndqofmxucd
