name: Publicar Edge Function gerar-video-ia

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gerar-video-ia
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/osvyra-v1-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar somente a branch autorizada
        uses: actions/checkout@v4
        with:
          ref: osvyra-v1-rebuild

      - name: Conferir commit e arquivo-alvo
        run: |
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse HEAD)"
          test -f supabase/functions/gerar-video-ia/index.ts

      - name: Publicar somente gerar-video-ia
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::O segredo SUPABASE_ACCESS_TOKEN ainda não foi configurado no GitHub."
            exit 1
          fi
          npx --yes supabase@latest functions deploy gerar-video-ia --project-ref zvtsudyxldndqofmxucd
