name: Teste de segurança do vídeo IA

on:
  push:
    branches:
      - osvyra-v1-rebuild
    paths:
      - 'tests/video-ia-seguranca.test.mjs'
      - 'tests/video-ia.test.mjs'
      - 'index.html'
      - 'supabase/functions/gerar-video-ia/index.ts'
      - '.github/workflows/video-ia-seguranca.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste-seguranca:
    name: Regressão de segurança (sem gerar vídeos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código da branch
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright e Chromium para testes reais de interface
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Executar regressão de segurança do backend
        run: node --experimental-strip-types tests/video-ia-seguranca.test.mjs

      - name: Executar regressão da interface de vídeo
        run: node tests/video-ia.test.mjs
